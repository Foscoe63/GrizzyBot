name: UI tests

# XCUITest overlay tests. They need a GUI session, so they run as their own job rather than
# inside the main CI one. The result bundle is uploaded on failure so it comes with a
# screenshot and accessibility tree (see OverlayUITests) instead of a bare assertion.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  ui:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: UI tests
        run: |
          xcodebuild -project GrizzyBot.xcodeproj -scheme GrizzyBot \
            -destination 'platform=macOS' -configuration Debug \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation -skipPackagePluginValidation \
            -only-testing:GrizzyBotUITests test
      - name: Upload result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-xcresult
          path: ${{ runner.temp }}/ui.xcresult
