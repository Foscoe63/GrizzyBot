name: MLX integration (nightly)

# Downloads a small model from Hugging Face and runs it. Too slow and
# network-dependent for every push, but it is the only check that catches an
# mlx-swift-lm bump breaking local inference.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  mlx:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Select newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      # `swift test` cannot compile MLX's Metal shaders, so every model load
      # fails with "Failed to load the default metallib". An Xcode build of the
      # app does produce them; hand that file to the test through the
      # GRIZZYBOT_MLX_METALLIB override MLXMetallibBootstrap honours.
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app to produce the Metal shader library
        run: |
          xcodebuild -project GrizzyBot.xcodeproj -scheme GrizzyBot \
            -destination 'platform=macOS' -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation -skipPackagePluginValidation build
      - name: Locate default.metallib
        run: |
          metallib="$(find "$RUNNER_TEMP/dd" -name '*.metallib' -print | head -1)"
          if [[ -z "$metallib" ]]; then
            echo "No .metallib anywhere under DerivedData. Bundles found:"
            find "$RUNNER_TEMP/dd" -name '*Cmlx*' -maxdepth 6
            exit 1
          fi
          echo "Using $metallib"
          echo "GRIZZYBOT_MLX_METALLIB=$metallib" >> "$GITHUB_ENV"

      - name: MLX integration tests
        env:
          GRIZZYBOT_MLX_INTEGRATION: "1"
        run: swift test --filter GrizzyBotMLXTests
