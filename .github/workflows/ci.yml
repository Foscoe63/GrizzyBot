name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    # The whole job takes ~12 minutes. Fail fast rather than sit on a hung
    # test until someone notices and cancels it by hand.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # mlx-swift needs Swift tools 6.3. The image default is older than that,
      # so pick the newest Xcode present rather than pinning a version that
      # will age out of the image.
      - name: Select an Xcode new enough for mlx-swift
        run: |
          newest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          echo "Selecting $newest"
          sudo xcode-select -s "$newest"
          xcodebuild -version
          swift --version

      - name: Agent eval CI suite
        run: swift test --filter 'Agent eval CI'
      - name: Swift tests
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app
          # mlx-swift ships a CudaBuild build-tool plugin, and the MLX
          # tokenizer bridge is a macro. Xcode wants both trusted
          # interactively, which cannot happen on a runner.
        run: |
          xcodebuild -project GrizzyBot.xcodeproj -scheme GrizzyBot \
            -destination 'platform=macOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation -skipPackagePluginValidation build
      # Only the app-target tests run here: the overlay snapshots (pixel
      # comparison with a tolerance — see OverlaySnapshotTests) and the artifact
      # web frame. GrizzyBotCoreTests already ran under `swift test` above, and
      # re-running it through xcodebuild both wasted ~8 minutes and hung: the
      # Security suite writes a secret, and SecItemAdd blocks forever against a
      # locked runner keychain where `swift test` does not.
      #
      # GrizzyBotUITests stays out for a different reason — all four of its
      # tests fail to find their overlay ("Missing settings-overlay"), and have
      # since before they ever ran here. A real bug, unrelated to what these
      # tests guard.
      - name: App unit tests and overlay snapshots
        run: |
          xcodebuild -project GrizzyBot.xcodeproj -scheme GrizzyBot \
            -destination 'platform=macOS' -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            -skipMacroValidation -skipPackagePluginValidation \
            -only-testing:GrizzyBotAppTests test

      # A failing snapshot writes the render it produced; upload it so the
      # difference can be seen rather than guessed at from a percentage.
      - name: Upload snapshot failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-failures
          path: .snapshot-failures/
          if-no-files-found: ignore
