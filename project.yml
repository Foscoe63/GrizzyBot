name: GrizzyBot

attributes:
  LastUpgradeCheck: "2700"
  LastSwiftUpdateCheck: "2700"
  BuildIndependentTargetsInParallel: true

options:
  bundleIdPrefix: com.grizzybot
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "27.0"
  projectFormat: xcode16_3

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 9.24.0
  # In-app MLX inference (the Local MLX provider). MLXLLM / MLXLMCommon live
  # here rather than in mlx-swift-examples; the tokenizer bridge comes from
  # swift-transformers via the MLXHuggingFace macros.
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.4
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: 1.3.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_TESTABILITY: YES
    MARKETING_VERSION: "0.8"
    CURRENT_PROJECT_VERSION: "9"
    # Match Xcode 27 recommended project settings (stops "Update to recommended settings").
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Release:
      DEAD_CODE_STRIPPING: YES

targets:
  GrizzyBotCore:
    # A framework, not a static library. GrizzyBotMLX has to be a framework —
    # a static library target cannot resolve the transitive SwiftPM C modules
    # MLX pulls in — and a framework linking a static Core would bake a second
    # copy of it into the app, so `MLXRuntime`'s registry would exist twice and
    # the generator the app registers would not be the one the chat client
    # reads. Both are embedded and re-signed with the app, which is what the
    # hardened runtime requires (it rejects differently-signed @rpath
    # frameworks at launch).
    type: framework
    platform: macOS
    sources:
      - path: Sources/GrizzyBotCore
        excludes:
          - GrizzyBotCore.h
      - path: Sources/GrizzyBotCore/GrizzyBotCore.h
        buildPhase: headers
        headerVisibility: public
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grizzybot.core
        PRODUCT_NAME: GrizzyBotCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_INSTALL_OBJC_HEADER: NO
        SWIFT_STRICT_CONCURRENCY: complete
        ENABLE_MODULE_VERIFIER: YES
        MODULE_VERIFIER_SUPPORTED_LANGUAGES: "objective-c objective-c++"
        MODULE_VERIFIER_SUPPORTED_LANGUAGE_STANDARDS: "gnu11 gnu++14"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic

  GrizzyBotRoutineAgent:
    type: tool
    platform: macOS
    sources:
      - path: Sources/GrizzyBotRoutineAgent
        excludes:
          - com.grizzybot.routine-agent.plist
    dependencies:
      - target: GrizzyBotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grizzybot.routine-agent
        PRODUCT_NAME: GrizzyBotRoutineAgent
        # Copied next to the app binary in Contents/MacOS, so it reaches the
        # GrizzyBotCore framework the app embeds rather than carrying its own.
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        # Copied into GrizzyBot.app via Copy Files — must not install as a separate archive product.
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic

  # The MLX runtime behind the Local MLX provider. Kept out of GrizzyBotCore
  # so the core library and its tests carry no MLX or tokenizer dependency;
  # the app installs the generator at launch via MLXRuntime.register.
  GrizzyBotMLX:
    # A framework, not a static library: a static library target cannot resolve
    # the transitive SwiftPM C modules MLX pulls in (Cmlx, _NumericsShims,
    # yyjson) — the Swift compile fails with "missing required module". It is
    # embedded and re-signed with the app so the hardened runtime accepts it.
    type: framework
    platform: macOS
    sources:
      - path: Sources/GrizzyBotMLX
        excludes:
          - GrizzyBotMLX.h
      - path: Sources/GrizzyBotMLX/GrizzyBotMLX.h
        buildPhase: headers
        headerVisibility: public
    dependencies:
      - target: GrizzyBotCore
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: MLXSwiftLM
        product: MLXHuggingFace
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grizzybot.mlx
        PRODUCT_NAME: GrizzyBotMLX
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_INSTALL_OBJC_HEADER: NO
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic

  GrizzyBot:
    type: application
    platform: macOS
    sources:
      - path: Sources/GrizzyBot
        excludes:
          - Info.plist
          - Resources
      # Vendored browser runtimes for the artifact frame. Copied as a folder
      # reference so the ArtifactRuntime directory name survives into the
      # bundle — ArtifactSchemeHandler looks the files up by subdirectory.
      - path: Sources/GrizzyBot/Resources/ArtifactRuntime
        type: folder
        buildPhase: resources
      - path: Sources/GrizzyBotRoutineAgent/com.grizzybot.routine-agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - target: GrizzyBotCore
        embed: true
        codeSign: true
      - target: GrizzyBotMLX
        embed: true
        codeSign: true
      - target: GrizzyBotRoutineAgent
        embed: true
        link: false
        copy:
          destination: executables
      - package: Sentry
        product: Sentry
    info:
      path: Sources/GrizzyBot/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSMicrophoneUsageDescription: GrizzyBot uses the microphone so you can dictate messages to a bot.
        NSSpeechRecognitionUsageDescription: GrizzyBot uses on-device speech recognition to turn dictation into chat text.
        NSAppleEventsUsageDescription: GrizzyBot agents can open URLs and control this Mac when a bot’s computer mode is This Mac.
        NSScreenCaptureUsageDescription: GrizzyBot captures the screen so a bot can see this Mac when computer mode is This Mac.
        NSAccessibilityUsageDescription: GrizzyBot uses Accessibility so a bot can see and control this Mac when computer mode is This Mac.
        NSLocalNetworkUsageDescription: GrizzyBot talks to local and LAN model servers (Ollama, LM Studio, vMLX, oMLX, Splash) on this network.
        NSBonjourServices:
          - "_http._tcp"
        SentryDSN: "$(SENTRY_DSN)"
    configFiles:
      Debug: Configs/Debug.xcconfig
      Release: Configs/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grizzybot.app
        PRODUCT_NAME: GrizzyBot
        EXECUTABLE_NAME: GrizzyBot
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/GrizzyBot/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: NO
      configs:
        Debug:
          ENABLE_HARDENED_RUNTIME: YES
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGN_ENTITLEMENTS: Sources/GrizzyBot/GrizzyBot.entitlements
          OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        Release:
          ENABLE_HARDENED_RUNTIME: "$(GRIZZYBOT_ENABLE_HARDENED_RUNTIME)"
          CODE_SIGN_IDENTITY: "$(GRIZZYBOT_CODE_SIGN_IDENTITY)"
          CODE_SIGN_ENTITLEMENTS: "$(GRIZZYBOT_CODE_SIGN_ENTITLEMENTS)"
          OTHER_CODE_SIGN_FLAGS: "$(GRIZZYBOT_OTHER_CODE_SIGN_FLAGS)"
          DEVELOPMENT_TEAM: "$(GRIZZYBOT_DEVELOPMENT_TEAM)"
          CODE_SIGN_STYLE: "$(GRIZZYBOT_CODE_SIGN_STYLE)"

    scheme:
      archive:
        revealArchiveInOrganizer: true
        customArchiveName: GrizzyBot
      testTargets:
        - GrizzyBotCoreTests
        - GrizzyBotAppTests
        - GrizzyBotUITests
      gatherCoverageData: false

  GrizzyBotCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GrizzyBotCoreTests
    dependencies:
      - target: GrizzyBotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grizzybot.core.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        BUNDLE_LOADER: ""
        TEST_HOST: ""

  GrizzyBotAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GrizzyBotAppTests
    resources:
      - path: Tests/GrizzyBotAppTests/Goldens
        optional: true
    dependencies:
      - target: GrizzyBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grizzybot.app.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/GrizzyBot.app/Contents/MacOS/GrizzyBot"
        BUNDLE_LOADER: "$(TEST_HOST)"
        MACOSX_DEPLOYMENT_TARGET: "15.0"

  GrizzyBotUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/GrizzyBotUITests
    dependencies:
      - target: GrizzyBot
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grizzybot.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        TEST_TARGET_NAME: GrizzyBot
        MACOSX_DEPLOYMENT_TARGET: "15.0"
