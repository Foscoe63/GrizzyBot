name: GrizzyBot
options:
  bundleIdPrefix: com.grizzybot
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CLANG_ENABLE_MODULES: YES
    ENABLE_TESTABILITY: YES

targets:
  GrizzyBotCore:
    # Static so the app doesn't embed a separate framework. Ad-hoc + Hardened
    # Runtime rejects differently-signed @rpath frameworks at launch (Team ID).
    type: library.static
    platform: macOS
    sources:
      - path: Sources/GrizzyBotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grizzybot.core
        PRODUCT_NAME: GrizzyBotCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic

  GrizzyBot:
    type: application
    platform: macOS
    sources:
      - path: Sources/GrizzyBot
        excludes:
          - Info.plist
    dependencies:
      - target: GrizzyBotCore
    info:
      path: Sources/GrizzyBot/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
    entitlements:
      path: Sources/GrizzyBot/GrizzyBot.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grizzybot.app
        PRODUCT_NAME: GrizzyBot
        EXECUTABLE_NAME: GrizzyBot
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/GrizzyBot/Info.plist
        COMBINE_HIDPI_IMAGES: YES
        SWIFT_STRICT_CONCURRENCY: complete
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
    scheme:
      testTargets:
        - GrizzyBotCoreTests
      gatherCoverageData: false

  GrizzyBotCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/GrizzyBotCoreTests
    dependencies:
      - target: GrizzyBotCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.grizzybot.core.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        # Host-less unit tests (Swift Testing).
        BUNDLE_LOADER: ""
        TEST_HOST: ""
